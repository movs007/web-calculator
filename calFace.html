<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="calFace.css">
</head>
<body>
    <main class="main-window">
        <!-- <header>
            <h1 class="Heading-text">My Calculator</h1>
        </header> -->
        <section class="calculator-section">
            <div class="main-calculator">
                <div class="cal-screen">
                    <div id="expression-display" class="calculation-display"></div>
                    <div id="display" class="result-display">0</div>
                </div>
                <div class="cal-keypad">
                        <button id="clear-btn" class="no">c</button>
                        <button id="back-btn" class="no">&#8678;</button>
                        <button class="no percent-btn">%</button>
                        <button class="no operator-btn">÷</button>
                        <button class="no value-btn">7</button>
                        <button class="no value-btn">8</button>
                        <button class="no value-btn">9</button>
                        <button class="no operator-btn">×</button>
                        <button class="no value-btn">4</button>
                        <button class="no value-btn">5</button>
                        <button class="no value-btn">6</button>
                        <button class="no operator-btn">-</button>
                        <button class="no value-btn">1</button>
                        <button class="no value-btn">2</button>
                        <button class="no value-btn">3</button>
                        <button class="no operator-btn">+</button>
                        <button class="no value-btn zero">0</button>
                        <button class="no decimal-btn">.</button>
                        <button id="equals-btn" class="no">=</button>
                   
                
                </div>
            </div>

        </section>
        
        

    </main> 
<script src="calculator.js"></script>
</body>
</html>
