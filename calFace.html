<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Calculator</title>
    <link rel="stylesheet" href="calFace.css">
</head>
<body>
    <main class="main-window">
        <header>
            <h1 class="Heading-text">My Calculator</h1>
        </header>
        <section class="calculator-section">
            <div class="main-calculator">
                <div class="cal-screen">
                    <div id="display" class="screen">0</div>
                </div>
                <div class="cal-keypad">
                    <button id="clear-btn" class="no"><h3>c</h3></button>
                    <button id="back-btn" class="no"><h3>?</h3></button>
                    <button class="no operator-btn"><h3>%</h3></button>
                    <button class="no operator-btn"><h3>/</h3></button>
                    <button class="no value-btn"><h3>7</h3></button>
                    <button class="no value-btn"><h3>8</h3></button>
                    <button class="no value-btn"><h3>9</h3></button>
                    <button class="no operator-btn"><h3>*</h3></button>
                    <button class="no value-btn"><h3>4</h3></button>
                    <button class="no value-btn"><h3>5</h3></button>
                    <button class="no value-btn"><h3>6</h3></button>
                    <button class="no operator-btn"><h3>-</h3></button>
                    <button class="no value-btn"><h3>1</h3></button>
                    <button class="no value-btn"><h3>2</h3></button>
                    <button class="no value-btn"><h3>3</h3></button>
                    <button class="no operator-btn"><h3>+</h3></button>
                    <button class="no value-btn"><h3>e</h3></button>
                    <button class="no value-btn"><h3>0</h3></button>
                    <button class="no value-btn"><h3>.</h3></button>
                    <button id="equals-btn" class="no"><h3>=</h3></button>
                
                </div>
            </div>

        </section>
        
        

    </main> 
<script src="calculator.js"></script>
</body>
</html>
